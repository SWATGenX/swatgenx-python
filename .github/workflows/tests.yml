name: Public API tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # daily live smoke of the public API
  workflow_dispatch:

jobs:
  test:
    # pinned: ubuntu-latest had moved to 26.04 by the 2026-11-12 run, where setup-python has no 3.9 (requires-python is >=3.9)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false   # one version's setup failure must not cancel the other's API test
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: pytest tests/ -v
        env:
          SWATGENX_API_KEY: ${{ secrets.SWATGENX_API_KEY }}
