[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swatgenx"
version = "0.1.1"
description = "Python client for SWATGenX — automated SWAT+/MODFLOW watershed models and open national water datasets for the conterminous US"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vahid Rafiei", email = "info@swatgenx.com" }]
keywords = ["SWAT+", "MODFLOW", "hydrology", "watershed", "groundwater", "PFAS", "USGS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://www.swatgenx.com"
Documentation = "https://www.swatgenx.com/developer-api"
Repository = "https://github.com/SWATGenX/swatgenx-python"
Changelog = "https://github.com/SWATGenX/swatgenx-python/blob/main/CHANGELOG.md"
"MCP server (agent access)" = "https://www.swatgenx.com/mcp"

[tool.setuptools.packages.find]
where = ["src"]
